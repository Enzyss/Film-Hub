# XcodeGen spec. The CI runs `xcodegen generate` to create FilmHub.xcodeproj,
# then `pod install` to add VLC. Nothing generated is committed.
name: FilmHub
options:
  bundleIdPrefix: com.enzyss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  JellyCore:
    path: JellyCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO

targets:
  FilmHub:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: JellyCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Film Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Serve per collegarsi a un server Jellyfin sulla rete di casa.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzyss.filmhub
        PRODUCT_NAME: FilmHub
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO

schemes:
  FilmHub:
    build:
      targets:
        FilmHub: all
    archive:
      config: Release
