name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test JellyCore (API, player choice, progress sync)
        working-directory: ios/JellyCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}

      - name: Install pods (VLC)
        run: pod install

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace FilmHub.xcworkspace \
            -scheme FilmHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FilmHub.xcarchive \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/FilmHub.xcarchive/Products/Applications/FilmHub.app build/Payload/
          cd build && zip -qry FilmHub.ipa Payload
          ls -lh FilmHub.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilmHub-ipa
          path: ios/build/FilmHub.ipa
          retention-days: 30
